---
- name: Baseline LXC Security and User Setup
  hosts: all
  tasks:

    - name: Ensure sudo is installed
      become: true
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true

    - name: Create ansible user with secure password
      become: true
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        password: "{{ ansible_become_pass | password_hash('sha512') }}"

    - name: Explicitly define sudo access for ansible user (requires password)
      become: true
      ansible.builtin.copy:
        content: "ansible ALL=(ALL:ALL) ALL"
        dest: /etc/sudoers.d/ansible
        mode: '0440'
        validate: /usr/sbin/visudo -csf %s

    - name: Set authorized key for ansible user
      become: true
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '~/.ssh/id_homelab.pub') }}"

    - name: Verify SSH connection as ansible user
      ansible.builtin.wait_for_connection:
        timeout: 10
      vars:
        ansible_user: ansible
        ansible_become: false

    - name: Enforce strict key-based SSH authentication
      become: true
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?KbdInteractiveAuthentication', line: 'KbdInteractiveAuthentication no' }
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      become: true
      ansible.builtin.systemd:
        name: ssh
        state: restarted
