---
- name: Deploy Tailscale Out-of-Band Management
  hosts: proxmox_hosts
  become: yes
  tasks:
    - name: Load encrypted SOPS variables
      community.sops.load_vars:
        file: vars/secrets.sops.yaml

    - name: Download the official Tailscale installation script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: '0755'

    - name: Execute the installation script
      ansible.builtin.command: /tmp/tailscale-install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Check Tailscale authentication status
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Authenticate and connect the node to the tailnet
      ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }} --advertise-tags=tag:server --accept-dns=false
      when: "'Logged out' in tailscale_status.stdout or tailscale_status.rc != 0"
