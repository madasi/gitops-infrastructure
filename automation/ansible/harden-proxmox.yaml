---
- name: Harden and Prepare Bare-Metal Proxmox Laptop Hosts
  hosts: proxmox_hosts
  become: true

  tasks:
    - name: Load encrypted SOPS variables
      community.sops.load_vars:
        file: vars/secrets.sops.yaml

    - name: Prevent laptop sleep on lid close
      ansible.builtin.replace:
        path: /etc/systemd/logind.conf
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '^#?HandleLidSwitch=.*', replace: 'HandleLidSwitch=ignore' }
        - { regexp: '^#?HandleLidSwitchExternalPower=.*', replace: 'HandleLidSwitchExternalPower=ignore' }
      notify: Restart systemd-logind

    - name: Disable Proxmox Enterprise Repositories (.list)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list

    - name: Disable Proxmox Enterprise Repositories (.sources)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources

    - name: Check whether standard APT sources.list exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: apt_sources_list

    - name: Remove enterprise entries from standard sources.list if present
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: '.*enterprise\.proxmox\.com.*'
        state: absent
      when: apt_sources_list.stat.exists

    - name: Add Proxmox No-Subscription Repository (.list)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        content: |
          deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription
        mode: '0644'

    - name: Add Proxmox Ceph No-Subscription Repository (.list)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ceph.list
        content: |
          deb http://download.proxmox.com/debian/ceph-squid bookworm no-subscription
        mode: '0644'

    - name: Update apt cache and upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Ensure essential utilities (sudo, git) are installed
      ansible.builtin.apt:
        name:
          - sudo
          - git
        state: present

    - name: Create dedicated ansible user
      ansible.builtin.user:
        name: ansible
        state: present
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        password: "{{ ansible_become_pass | password_hash('sha512') }}"

    - name: Explicitly define sudo access for ansible user (requires password)
      ansible.builtin.copy:
        content: "ansible ALL=(ALL:ALL) ALL"
        dest: /etc/sudoers.d/ansible
        mode: '0440'
        validate: /usr/sbin/visudo -csf %s

    - name: Set up authorized keys for the ansible user
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '~/.ssh/id_homelab.pub') }}"

    - name: Deploy persistent Proxmox subscription nag removal script (Post-Invoke hook)
      ansible.builtin.copy:
        dest: /usr/local/bin/pve-remove-nag.sh
        content: |
          #!/bin/sh
          WEB_JS=/usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
          if [ -s "$WEB_JS" ] && ! grep -q NoMoreNagging "$WEB_JS"; then
              sed -i -e "/data\.status/ s/!//" -e "/data\.status/ s/active/NoMoreNagging/" "$WEB_JS"
          fi
        mode: '0755'

    - name: Configure APT Post-Invoke hook to keep nag removed on package updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/no-nag-script
        content: |
          DPkg::Post-Invoke { "/usr/local/bin/pve-remove-nag.sh"; };
        mode: '0644'

    - name: Run subscription nag removal once immediately
      ansible.builtin.command: /usr/local/bin/pve-remove-nag.sh
      register: nag_removal
      changed_when: "'Patching' in nag_removal.stdout or nag_removal.rc == 0"
      notify: Restart pveproxy

    - name: Update Proxmox appliance template database
      ansible.builtin.command: pveam update
      changed_when: false

    - name: Download latest Debian 12 LXC template dynamically
      ansible.builtin.shell: |
        set -o pipefail
        TEMPLATE=$(pveam available -section system | grep 'debian-12-standard' | awk '{print $2}' | sort -V | tail -n 1)
        if [ ! -f "/var/lib/vz/template/cache/$TEMPLATE" ]; then
          pveam download local $TEMPLATE
          echo "changed:$TEMPLATE"
        else
          echo "exists:$TEMPLATE"
        fi
      args:
        executable: /bin/bash
      register: template_download
      changed_when: "'changed:' in template_download.stdout"

    - name: Enforce strict key-based SSH authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?KbdInteractiveAuthentication', line: 'KbdInteractiveAuthentication no' }
      notify: Restart SSH

  handlers:
    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted

    - name: Restart pveproxy
      ansible.builtin.systemd:
        name: pveproxy
        state: restarted

    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted
